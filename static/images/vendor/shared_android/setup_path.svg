<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="Four setup steps: enroll the device, add the app, configure the app, and the device is ready for users." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="setup-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="189" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="139" y1="58" x2="285" y2="58" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#setup-arrow)"/>
  <line x1="365" y1="58" x2="511" y2="58" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#setup-arrow)"/>
  <line x1="591" y1="58" x2="737" y2="58" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#setup-arrow)"/>
  <circle cx="103" cy="58" r="26" fill="#3b82f6"/>
  <text x="103" y="58" dy="6" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">1</text>
  <text x="103" y="116" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Enroll the device</text>
  <text x="103" y="140" text-anchor="middle" font-size="14" fill="#64748b">Android Enterprise</text>
  <text x="103" y="159" text-anchor="middle" font-size="14" fill="#64748b">dedicated</text>
  <circle cx="329" cy="58" r="26" fill="#3b82f6"/>
  <text x="329" y="58" dy="6" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">2</text>
  <text x="329" y="116" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Add the app</text>
  <text x="329" y="140" text-anchor="middle" font-size="14" fill="#64748b">IDmelon Authenticator,</text>
  <text x="329" y="159" text-anchor="middle" font-size="14" fill="#64748b">assigned as Required</text>
  <circle cx="555" cy="58" r="26" fill="#3b82f6"/>
  <text x="555" y="58" dy="6" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">3</text>
  <text x="555" y="116" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Configure the app</text>
  <text x="555" y="140" text-anchor="middle" font-size="14" fill="#64748b">shared mode, API key,</text>
  <text x="555" y="159" text-anchor="middle" font-size="14" fill="#64748b">login method</text>
  <circle cx="781" cy="58" r="26" fill="#22c55e"/>
  <path d="M 770 58 l 7 8 l 14 -15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="781" y="116" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Ready for users</text>
  <text x="781" y="140" text-anchor="middle" font-size="14" fill="#64748b">app activates on</text>
  <text x="781" y="159" text-anchor="middle" font-size="14" fill="#64748b">first launch</text>
</svg>
